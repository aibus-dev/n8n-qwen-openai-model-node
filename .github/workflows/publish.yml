name: Publish to npm

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Trusted publishing (OIDC) + provenance, as n8n requires for verified community nodes.
      # prepublishOnly (`n8n-node prerelease`) only guards local publishes; lint/build already ran above.
      - run: npm publish --provenance --access public --ignore-scripts
